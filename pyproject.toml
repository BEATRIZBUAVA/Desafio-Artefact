[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-agente"
version = "0.1.0"
description = "Agente de atendimento da Empório da Música (desafio técnico Artefact)"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.20",
    "pandas>=2.2",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
